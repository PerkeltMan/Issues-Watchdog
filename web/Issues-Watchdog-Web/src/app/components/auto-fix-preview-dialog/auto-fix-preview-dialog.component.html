<div class="auto-fix-preview-dialog">
  <!-- Explanation Section -->
  <div class="explanation-section">
    <h2>AI's Explanation</h2>
    <div class="explanation-text">{{ explanation }}</div>
  </div>

  <!-- Changes Section -->
  <div class="changes-section">
    <h2>Proposed Changes</h2>
    <div class="changes-list">
      @for (change of changes; track change.filePath) {
        <div class="change-item">
          <h3 class="file-path">{{ change.filePath }}</h3>
          <pre class="new-content"><code>{{ change.newContent }}</code></pre>
        </div>
      }
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="dialog-actions">
    <button
      mat-button
      (click)="onCancel()"
      [disabled]="isSubmitting()"
    >
      Cancel
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onAccept()"
      [disabled]="isSubmitting()"
    >
      @if (isSubmitting()) {
        <span class="button-content">
          <mat-icon class="spinner-icon">schedule</mat-icon>
          Submitting…
        </span>
      } @else {
        <span>Accept</span>
      }
    </button>
  </div>
</div>
